<div class="col">
  <article class="animate-underline">
    <a class="hover-effect-opacity position-relative d-block mb-3" [routerLink]="['/catalog', product.id]">
      <div class="position-relative d-flex hover-effect-opacity overflow-hidden rounded-4 img-container">
        <!-- Badge prix barré en haut à droite -->
        <div *ngIf="product.sale_price && product.price !== product.sale_price"
          class="position-absolute top-0 end-0 p-2 z-1">
          <div class="badge bg-danger py-2 px-3">
            <span class="text-decoration-line-through me-1">{{product.price | currency:'XOF':true:'1.0-0'}}</span>
            <!-- <span>-{{product.discount_percentage}}%</span> -->
          </div>
        </div>

        <img alt="{{product.name}}" loading="lazy" decoding="async" data-nimg="1"
          class="hover-effect-target opacity-100" srcset="{{getProductImage1(product)}}"
          src="{{getProductImage1(product)}}" style="color: transparent;">

        <img alt="{{product.name}}" loading="lazy" decoding="async" data-nimg="1"
          class="position-absolute top-0 start-0 hover-effect-target opacity-0" srcset="{{getProductImage2(product)}}"
          src="{{getProductImage2(product)}}" style="color: transparent;">
      </div>
    </a>

    <div class="d-flex flex-column justify-content-between mb-2">
      <h3 class="mb-0"><a class="d-block fs-sm fw-medium text-truncate" [routerLink]="['/catalog', product.id]">
          <span class="animate-target">{{product.name}}</span></a>
      </h3>
      <div class="d-flex flex-column">
        <span class="h6 mb-0 text-danger">{{product.sale_price | currency:'XOF':true:'1.0-0'}}</span>
      </div>
    </div>

    <div class="d-flex gap-2 pt-2">
      <!-- Si le produit n'est pas dans le panier, afficher le bouton d'ajout -->
      <button *ngIf="!inCart" type="button" class="btn btn-sm btn-primary rounded-pill w-100" (click)="addToCart()">
        Ajouter au panier
      </button>

      <!-- Si le produit est déjà dans le panier, afficher le contrôle de quantité -->
      <div *ngIf="inCart" class="quantity-control w-100">
        <button class="minus-btn" (click)="decrementQuantity()">−</button>
        <span class="quantity-display">{{cartQuantity}}</span>
        <button class="plus-btn" (click)="incrementQuantity()">+</button>
      </div>

      <!-- Bouton favoris -->
      <button type="button" class="btn btn-icon btn-secondary rounded-circle animate-pulse"
        aria-label="Add to Wishlist">
        <i class="ci-heart fs-base animate-target"></i>
      </button>
    </div>

    <!-- Indicateur de stock -->
    <div class="mt-1 small" *ngIf="product.stock_quantity <= 5 && product.stock_quantity > 0">
      <span class="text-warning">Plus que {{product.stock_quantity}} en stock!</span>
    </div>
    <div class="mt-1 small" *ngIf="product.stock_quantity === 0">
      <span class="text-danger">Rupture de stock</span>
    </div>
  </article>
</div>
