<div aria-label="breadcrumb" class="pt-lg-2 my-3 my-lg-4 container">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="/">Accueil</a></li>
    <li class="breadcrumb-item active" aria-current="page">
      Catalogue de produits
    </li>
  </ol>
</div>
<h1 class="h3 container pb-2 pb-md-3 pb-lg-4">Catalogue de produits</h1>
<section class="pb-5 mb-2 mb-sm-3 mb-lg-4 mb-xl-5 container">
  <div class="row">
    <aside class="col-lg-3">
      <div
        class="pe-lg-4 offcanvas-lg offcanvas-start"
        aria-labelledby="filtersSidebar"
      >
        <div class="py-3 offcanvas-header">
          <h5 class="offcanvas-title" id="filtersSidebar">Filter products</h5>
          <button type="button" class="btn-close" aria-label="Close"></button>
        </div>
        <div class="flex-column pt-2 py-lg-0 offcanvas-body">
          <div class="pb-2 accordion">
            <div
              class="border-0 mb-3 accordion-item"
              *ngFor="let category of categories"
            >
              <h4
                class="h6 cursor-pointer p-0 m-0 accordion-button"
                [class.collapsed]="!category.collapsed"
                (click)="toggleCategory(category)"
              >
                <span
                  class="d-flex align-items-center justify-content-center bg-body-secondary rounded-circle me-3"
                  style="width: 56px; height: 56px"
                >
                  <span class="d-flex" style="width: 40px">
                    <img
                      alt="Image"
                      loading="lazy"
                      class="category-icon"
                      decoding="async"
                      src="{{ category.icon_url }}"
                      style="color: transparent"
                  /></span>
                </span>
                <span class="fs-sm">{{ category.name }}</span>
              </h4>
              <div
                class="accordion-collapse"
                [class.collapse]="!category.collapsed"
              >
                <div class="ps-4 pb-0 accordion-body">
                  <ul
                    class="flex-column gap-2 border-start px-4 pb-1 ms-1 mb-0 nav"
                  >
                    <li
                      class="pb-1 ps-3 ms-1 nav-item"
                      *ngFor="let child of category.children"
                    >
                      <a
                        class="hover-effect-underline fw-normal p-0 nav-link"
                        href="#"
                        >{{ child.name }}</a
                      >
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <button
        type="button"
        data-bs-theme="light"
        class="fixed-bottom z-sticky w-100 border-0 border-top border-light border-opacity-10 rounded-0 pb-4 d-lg-none btn btn-dark btn-lg"
      >
        <i class="ci-filter fs-base me-2"></i>Filters
      </button>
    </aside>
    <div class="col-lg-9">
      <div class="d-flex flex-wrap gap-2 mb-4">
        <button type="button" class="btn btn-secondary btn-sm">
          <i class="ci-close fs-sm ms-n1 me-1"></i>Sale</button
        ><button type="button" class="btn btn-secondary btn-sm">
          <i class="ci-close fs-sm ms-n1 me-1"></i>Gluten-free</button
        ><button type="button" class="btn btn-secondary btn-sm">
          <i class="ci-close fs-sm ms-n1 me-1"></i>Nestlé</button
        ><button type="button" class="btn btn-secondary btn-sm">
          <i class="ci-close fs-sm ms-n1 me-1"></i>$1 - $30</button
        ><button
          type="button"
          class="bg-transparent border-0 text-decoration-underline px-0 ms-2 btn btn-secondary btn-sm"
        >
          Clear all
        </button>
      </div>
      <div
        class="g-4 row row-cols-xl-4 row-cols-lg-3 row-cols-md-4 row-cols-sm-3 row-cols-2"
      >
        @for (product of products; track $index) {
        <app-product-item [product]="product"></app-product-item>
        }
      </div>
      <div
        class="toast-container bottom-0 end-0 position-fixed z-fixed p-3"
      ></div>
      <nav class="border-top mt-4 pt-3" aria-label="Shop pagination">
        <ul class="pt-2 pt-md-3 pagination pagination-lg">
          <li class="me-auto page-item disabled">
            <span
              class="page-link d-flex align-items-center h-100 fs-xl px-2"
              aria-label="Previous page"
              ><i class="ci-chevron-left"></i
            ></span>
          </li>
          <li class="page-item active">
            <span class="page-link" aria-current="page"
              >1<span class="visually-hidden">(current)</span></span
            >
          </li>
          <li class="page-item">
            <a class="page-link" role="button" tabindex="0" href="#">2</a>
          </li>
          <li class="page-item">
            <a class="page-link" role="button" tabindex="0" href="#">3</a>
          </li>
          <li class="page-item">
            <a class="page-link" role="button" tabindex="0" href="#"
              ><span aria-hidden="true">…</span
              ><span class="visually-hidden">More</span></a
            >
          </li>
          <li class="page-item">
            <a class="page-link" role="button" tabindex="0" href="#">16</a>
          </li>
          <li class="ms-auto page-item">
            <a
              class="page-link d-flex align-items-center h-100 fs-xl px-2"
              aria-label="Next page"
              role="button"
              tabindex="0"
              href="#"
              ><i class="ci-chevron-right"></i
            ></a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</section>
