<section class="hero-section" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">

  <!-- Background with gradient overlay -->
  <div class="hero-background">
    <div class="gradient-overlay" [ngClass]="getCurrentSlide().color"></div>
    <div class="pattern-overlay"></div>
  </div>

  <!-- Floating elements -->
  <div class="floating-elements">
    <div class="floating-circle circle-1"></div>
    <div class="floating-circle circle-2"></div>
    <div class="floating-circle circle-3"></div>
    <div class="floating-line line-1"></div>
    <div class="floating-line line-2"></div>
  </div>

  <div class="container">
    <div class="hero-content">

      <!-- Left side - Text content -->
      <div class="content-left">
        <div class="brand-logo">
          <img src="assets/logo/dijanna-hijab-logo.png" alt="Dijanna Hijab" class="logo">
        </div>

        <div class="text-content">
          <h1 class="main-title">
            <span class="title-line">Élégance & Modestie</span>
            <span class="title-line gradient-text">Habillez votre Foi</span>
            <span class="title-line">avec Style</span>
          </h1>

          <div class="slide-info">
            <h2 class="slide-title">{{ getCurrentSlide().title }}</h2>
            <h3 class="slide-subtitle">{{ getCurrentSlide().subtitle }}</h3>
            <p class="slide-description">{{ getCurrentSlide().description }}</p>
            <div class="price-tag">
              <span class="price">{{ getCurrentSlide().price }}</span>
            </div>
          </div>

          <div class="cta-buttons">
            <button class="btn btn-primary">
              <span>Découvrir la Collection</span>
              <i class="arrow-icon">→</i>
            </button>
            <button class="btn btn-secondary">
              <span>Nous Contacter</span>
              <i class="phone-icon">📞</i>
            </button>
          </div>

          <div class="contact-info">
            <p>📞 +221 77 893 91 12</p>
            <p>Site web en construction</p>
          </div>
        </div>
      </div>

      <!-- Right side - Image slider -->
      <div class="content-right">
        <div class="slider-container">

          <!-- Previous thumbnail -->
          <div class="thumbnail-prev">
            <img [src]="slides[(currentSlide - 1 + slides.length) % slides.length].image" alt="Previous"
              class="thumbnail-img">
          </div>

          <!-- Main image -->
          <div class="main-image-container">
            <div class="image-frame">
              <img [src]="getCurrentSlide().image" alt="{{ getCurrentSlide().title }}" class="main-image">
              <div class="image-overlay"></div>
            </div>
          </div>

          <!-- Next thumbnail -->
          <div class="thumbnail-next">
            <img [src]="slides[(currentSlide + 1) % slides.length].image" alt="Next" class="thumbnail-img">
          </div>

          <!-- Navigation buttons -->
          <button class="nav-btn nav-prev" (click)="prevSlide()">
            <i class="nav-icon">←</i>
          </button>
          <button class="nav-btn nav-next" (click)="nextSlide()">
            <i class="nav-icon">→</i>
          </button>
        </div>

        <!-- Slide indicators -->
        <div class="slide-indicators">
          <button *ngFor="let slide of slides; let i = index" class="indicator" [class.active]="i === currentSlide"
            (click)="goToSlide(i)">
            <span class="indicator-dot"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator">
    <div class="scroll-line"></div>
    <span class="scroll-text">Scroll</span>
  </div>
</section>
