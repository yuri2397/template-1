<section class="container py-5 my-2 my-sm-3 mb-md-2 mt-lg-4 my-xl-5">
  <h2 class="h3 text-center pb-1 pb-sm-2 pb-md-3 pb-lg-0 mb-4 mb-lg-5">Shop by lifestyle</h2>

  <!-- Loading indicator -->
  <div *ngIf="loading" class="text-center py-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Error message -->
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- Swiper container -->
  <div *ngIf="!loading && !error" class="swiper pb-lg-2" data-swiper="{
          &quot;slidesPerView&quot;: 1,
          &quot;spaceBetween&quot;: 24,
          &quot;pagination&quot;: {
            &quot;el&quot;: &quot;.swiper-pagination&quot;,
            &quot;clickable&quot;: true
          },
          &quot;breakpoints&quot;: {
            &quot;500&quot;: {
              &quot;slidesPerView&quot;: 2
            },
            &quot;768&quot;: {
              &quot;slidesPerView&quot;: 3
            },
            &quot;992&quot;: {
              &quot;slidesPerView&quot;: 4
            }
          }
        }">
    <div class="row row-cols-3 row-cols-md-4 row-cols-lg-5 gy-5 gy-md-5">

      <!-- Category items - with Angular *ngFor -->
      <div *ngFor="let category of categories" class="col">
        <div class="position-relative d-inline-block text-dark-emphasis bg-warning-subtle rounded-circle p-5 mb-4">
          <!-- This SVG can be made dynamic based on category type if needed -->
          <img [src]="category.icon_url" alt="Category Image" class="img-fluid">
        </div>
        <h3 class="h5 mb-2 text-center">
          <a class="animate-underline stretched-link" >
            <span class="animate-target">{{ category.name }}</span>
            <!-- [routerLink]="['/shop', category.slug]" -->
          </a>
        </h3>
        <p class="fs-sm mb-0">{{ category.description || 'Explorer notre collection' }}</p>
      </div>

      <!-- No categories message -->
      <div *ngIf="categories.length === 0" class="text-center w-100 py-4">
        <p>Aucune catégorie disponible pour le moment.</p>
      </div>

    </div>

    <!-- Slider pagination (Bullets) -->
    <div class="swiper-pagination position-static mt-3 mt-sm-4"></div>
  </div>
</section>
