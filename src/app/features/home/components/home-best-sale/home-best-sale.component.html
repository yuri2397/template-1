<section class="container pb-5 mb-sm-2 mb-md-3 mb-lg-4 mb-xl-5">
  <h2 class="h3 pb-3">Découvrez nos produits en solde</h2>

  <!-- Nav pills -->
  <nav class="overflow-x-auto mb-3" data-simplebar="init" data-simplebar-auto-hide="false">
    <div class="simplebar-wrapper" style="margin: 0px;">
      <div class="simplebar-height-auto-observer-wrapper">
        <div class="simplebar-height-auto-observer"></div>
      </div>
      <div class="simplebar-mask">
        <div class="simplebar-offset" style="right: 0px; bottom: 0px;">
          <div class="simplebar-content-wrapper" tabindex="0" role="region" aria-label="scrollable content"
            style="height: auto; overflow: hidden;">
            <div class="simplebar-content" style="padding: 0px;">
              <ul class="nav nav-pills flex-nowrap text-nowrap pb-3">
                <li *ngFor="let category of categoryList" class="nav-item">
                  <a class="nav-link " aria-current="page" routerLink="/shop/{{ category.slug }}">{{ category.name }}</a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <div class="simplebar-placeholder" style="width: 995px; height: 56px;"></div>
    </div>
    <div class="simplebar-track simplebar-horizontal" style="visibility: hidden;">
      <div class="simplebar-scrollbar simplebar-visible" style="width: 0px; display: none;"></div>
    </div>
    <div class="simplebar-track simplebar-vertical" style="visibility: hidden;">
      <div class="simplebar-scrollbar simplebar-visible" style="height: 0px; display: none;"></div>
    </div>
  </nav>
